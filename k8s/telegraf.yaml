apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf-deployment
  namespace: hydrosense-iot
  labels:
    app.kubernetes.io/name: telegraf
    app.kubernetes.io/component: telemetry-ingest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telegraf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegraf
        app.kubernetes.io/component: telemetry-ingest
    spec:
      containers:
        - name: telegraf
          image: telegraf:latest
          volumeMounts:
            - name: telegraf-config-volume
              mountPath: /etc/telegraf/telegraf.conf
              subPath: telegraf.conf
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: telegraf-config-volume
          configMap:
            name: telegraf-config
