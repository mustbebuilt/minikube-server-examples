apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: hydrosense-iot
data:
  mosquitto.conf: |
    # Mosquitto MQTT Configuration for Kubernetes / Minikube
    listener 1883
    allow_anonymous true

    listener 9001
    protocol websockets
    allow_anonymous true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-config
  namespace: hydrosense-iot
data:
  telegraf.conf: |
    # Telegraf Configuration for HydroSense IoT River Monitoring
    [agent]
      interval = "5s"
      round_interval = true
      metric_batch_size = 1000
      metric_buffer_limit = 10000
      collection_jitter = "0s"
      flush_interval = "5s"
      flush_jitter = "0s"
      precision = ""
      debug = false
      quiet = false
      logfile = ""

    # Output Plugin: InfluxDB v2
    [[outputs.influxdb_v2]]
      urls = ["http://influxdb-service:8086"]
      token = "hydrosense-super-secret-auth-token-123"
      organization = "hydrosense"
      bucket = "river_water_quality"

    # Input Plugin: MQTT Consumer
    [[inputs.mqtt_consumer]]
      servers = ["tcp://mosquitto-service:1883"]
      topics = [
        "water-quality/rivers/+/telemetry"
      ]
      qos = 1
      client_id = "telegraf-river-subscriber"
      data_format = "json_v2"

      [[inputs.mqtt_consumer.topic_parsing]]
        topic = "water-quality/rivers/+/telemetry"
        measurement = "_/_/_/measurement"
        tags = "_/_/riverId/_"

      [[inputs.mqtt_consumer.json_v2]]
        measurement_name = "river_water_quality"
        [[inputs.mqtt_consumer.json_v2.object]]
          path = "@this"
          tags = ["deviceId", "riverId", "riverName"]
          
          [inputs.mqtt_consumer.json_v2.object.fields]
            "telemetry_oxygenSaturationPct" = "float"
            "telemetry_dissolvedOxygenMgl" = "float"
            "telemetry_waterTempC" = "float"
            "telemetry_ph" = "float"
            "status_batteryPct" = "int"
            "status_hypoxiaWarning" = "bool"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: hydrosense-iot
data:
  influxdb.yml: |
    apiVersion: 1
    datasources:
      - name: InfluxDB_RiverQuality
        type: influxdb
        access: proxy
        url: http://influxdb-service:8086
        isDefault: true
        jsonData:
          version: Flux
          organization: hydrosense
          defaultBucket: river_water_quality
        secureJsonData:
          token: hydrosense-super-secret-auth-token-123

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: hydrosense-iot
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'River Water Quality Monitoring'
        orgId: 1
        folder: 'HydroSense IoT'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/json

---
